<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AquaSentinel</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#07111f;color:#eaf4ff;font-family:Inter,system-ui}.wrap{max-width:1200px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#8fa6bd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#0d1b2d;border:1px solid #20344e;border-radius:20px;padding:20px}.value{font-size:36px;font-weight:800;margin:8px 0}.status{font-size:13px;font-weight:700}.ok{color:#53e0b4}.bad{color:#ff8d8d}.charts{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-top:16px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{padding:10px;border-radius:10px;border:1px solid #2b405a;background:#081525;color:white}button{cursor:pointer}.table{width:100%;border-collapse:collapse}.table td{padding:9px;border-bottom:1px solid #1b2d42}@media(max-width:800px){.grid,.charts{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>🌊 AquaSentinel</h1><div class="muted">Real-time aquaculture water quality</div></div><form action="/logout" method="post"><button>Logout</button></form></div><div class="grid" style="margin-top:18px"><div class="card"><div>Temperature</div><div id="temp" class="value">-- °C</div><div id="ts" class="muted">Waiting for ESP32</div></div><div class="card"><div>pH</div><div id="ph" class="value">--</div><div id="phs" class="status">--</div></div><div class="card"><div>Turbidity</div><div id="tur" class="value">--</div><div id="turs" class="status">--</div></div></div><div class="charts"><div class="card"><h3>Live history</h3><canvas id="chart"></canvas></div><div class="card"><h3>Thresholds</h3><div id="settings"></div><button onclick="saveSettings()">Save thresholds</button><h3>Alert history</h3><div id="alerts" class="muted"></div></div></div></div><script>
let chart=new Chart(document.getElementById("chart"),{type:"line",data:{labels:[],datasets:[{label:"Temp °C",data:[]},{label:"pH",data:[]},{label:"Turbidity",data:[]}]},options:{responsive:true,animation:false}});
let cfg={};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
async function load(){let r=await fetch("/api/readings?limit=60");let a=await r.json();chart.data.labels=a.map(x=>new Date(x.created_at).toLocaleTimeString());chart.data.datasets[0].data=a.map(x=>x.temperature);chart.data.datasets[1].data=a.map(x=>x.ph);chart.data.datasets[2].data=a.map(x=>x.turbidity);chart.update();let x=a.at(-1);if(x){document.getElementById("temp").textContent=x.temperature.toFixed(2)+" °C";document.getElementById("ph").textContent=x.ph.toFixed(2);document.getElementById("tur").textContent=x.turbidity.toFixed(2);document.getElementById("ts").textContent="Updated "+new Date(x.created_at).toLocaleString()}let s=await (await fetch("/api/settings")).json();cfg=s;document.getElementById("settings").innerHTML=Object.entries(s).map(([k,v])=>'<label>'+k+'<input id="'+k+'" type="number" step="0.1" value="'+v+'"></label>').join("<br>");let al=await (await fetch("/api/alerts")).json();document.getElementById("alerts").innerHTML=al.slice(0,8).map(x=>'<div style="margin:8px 0"><b class="bad">'+esc(x.level)+'</b> '+esc(x.sensor)+' '+x.value+'<br><small>'+new Date(x.created_at).toLocaleString()+'</small></div>').join("")||"No alerts";setStatus(x,s)}
function setStatus(x,s){if(!x)return;let ph=x.ph>=s.ph_min&&x.ph<=s.ph_max,tu=x.turbidity<=s.turbidity_max,t=x.temperature>=s.temp_min&&x.temperature<=s.temp_max;for(let [id,v] of [["phs",ph],["turs",tu]]){let e=document.getElementById(id);e.textContent=v?"NORMAL":"CRITICAL";e.className="status "+(v?"ok":"bad")}}
async function saveSettings(){let d={};Object.keys(cfg).forEach(k=>d[k]=Number(document.getElementById(k).value));await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});load()}load();setInterval(load,5000);
</script></body></html>
