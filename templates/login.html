<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>AquaSentinel Login</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#eef6ff;font-family:Inter,system-ui}.card{width:min(420px,92vw);padding:32px;border:1px solid #20344e;border-radius:24px;background:#0d1b2d;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px;font-size:30px}p{color:#91a6bd}input,button{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:1px solid #2b405a;background:#081525;color:white}button{background:#27b6a8;border:0;font-weight:700;cursor:pointer}.err{color:#ff8d8d}</style></head><body><form class="card" method="post"><h1>🌊 AquaSentinel</h1><p>Private aquaculture monitoring dashboard</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="err">{{m}}</div>{% endfor %}{% endwith %}<input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button></form></body></html>
